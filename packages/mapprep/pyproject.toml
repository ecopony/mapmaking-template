[project]
name = "mapprep"
version = "0.1.0"
description = "Shared geospatial helpers for mapmaking pipelines"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "rasterio",
    "shapely",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapprep"]
